name: YouTube to Telegram

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs during busy periods.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish new uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_HANDLE: Sir_Mr_yellow138
          INITIAL_POST_LIMIT: "3"
          MAX_ITEMS: "15"
        run: python bot.py

      - name: Save duplicate-prevention state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update YouTube posting state [skip ci]"
            git push
          fi
